# Taskfile for wasmaqua — https://taskfile.dev
#
#   task            # list the available tasks
#   task migrate    # print the wasmbox --frame=aqua migration recipe (start here)
#   task build      # build wasmaqua.wasm (embeds compositor.rb)
#   task serve      # build, then serve http://localhost:8081/ with COOP/COEP
#   task test       # run native Go + Ruby unit tests (rbtest)
#   task clean      # remove the build artifacts
#
# DEPRECATED — wasmaqua is superseded by wasmbox + the AquaFrame preset
# (one binary, both looks). Run `task migrate` for the recipe. This repo
# stays buildable for legacy users; new decoration work goes into wasmbox.
#
# wasmaqua is the macOS-Aqua-themed sibling of wasmbox. It embeds the same Ruby
# compositor (forked, themed) into a wasm via //go:embed and exposes the SAME
# external-client protocol, so the same hello / dock / quake / terminal / files
# wasm clients work unmodified — only the window decoration differs.
version: "3"

vars:
  PORT: "8081"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  migrate:
    desc: "DEPRECATED — print the wasmbox --frame=aqua migration recipe"
    silent: true
    cmds:
      - |
        echo ""
        echo "wasmaqua is superseded by wasmbox + the AquaFrame preset."
        echo ""
        echo "Migration recipe (one terminal):"
        echo ""
        echo "  cd ../wasmbox          # sibling repo"
        echo "  pkgx task build:compositor"
        echo "  pkgx task serve        # serves http://localhost:8080/"
        echo ""
        echo "Then open one of:"
        echo ""
        echo "  http://localhost:8080/?frame=aqua                    # bare Aqua (= old wasmaqua)"
        echo "  http://localhost:8080/?frame=aqua-whitesur-light     # Aqua + WhiteSur palette ≈ macOS Big Sur"
        echo "  http://localhost:8080/?frame=aqua-whitesur-dark      # ≈ Big Sur dark"
        echo "  http://localhost:8080/?frame=aqua-juno               # Aqua + Juno teal palette"
        echo "  http://localhost:8080/?frame=aqua-adwaita-light"
        echo "  http://localhost:8080/?frame=aqua-adwaita-dark"
        echo "  http://localhost:8080/?frame=aqua-solarized-light"
        echo "  http://localhost:8080/?frame=aqua-solarized-dark"
        echo ""
        echo "Full registry: see wasmbox/compositor/02_frame.rb (FrameRegistry::TABLE)"

  build:
    desc: Build wasmaqua.wasm + native dev server
    deps: [build:compositor, build:serve]

  build:compositor:
    desc: Build wasmaqua.wasm (embeds compositor.rb)
    env:
      GOWORK: "off"
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build -o wasmaqua.wasm .
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./wasm_exec.js 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ./wasm_exec.js
    generates:
      - wasmaqua.wasm
      - wasm_exec.js

  build:serve:
    desc: Build the native dev server (cmd/serve) with COOP/COEP headers
    env:
      GOWORK: "off"
    cmds:
      - mkdir -p bin
      - go build -o bin/wasmaqua-serve ./cmd/serve
    generates:
      - bin/wasmaqua-serve

  serve:
    desc: Build, then serve the compositor at http://localhost:{{.PORT}}/ with COOP/COEP
    deps: [build]
    cmds:
      - 'echo "serving http://localhost:{{.PORT}}/ — open /index.html"'
      - ./bin/wasmaqua-serve -addr :{{.PORT}}

  test:
    desc: Run native unit tests (Ruby pure-WM half via rbtest) — no browser required
    env:
      GOWORK: "off"
    cmds:
      - go run ./cmd/rbtest

  clean:
    desc: Remove the build artifacts
    cmds:
      - rm -f wasmaqua.wasm wasm_exec.js
      - rm -rf bin
